
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile Setup | Let's Talk English Class</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 20px 6%;
      font-weight: bold;
      color: #2563eb;
      border-bottom: 1px solid #e5eaf3;
    }

    main {
      max-width: 950px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      padding: 28px;
      border-radius: 18px;
      border: 1px solid #e5eaf3;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    h3 {
      margin: 25px 0 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #dbe2ee;
      border-radius: 9px;
      font: inherit;
      background: white;
      color: #172033;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    input[readonly] {
      background: #f8fafc;
      color: #64748b;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    hr {
      border: 0;
      border-top: 1px solid #e5eaf3;
      margin: 25px 0;
    }

    button {
      padding: 13px 18px;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #e0e7ff;
      color: #1d4ed8;
      margin-left: 8px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      color: #b91c1c;
      font-size: 14px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .success {
      color: #15803d;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .panel {
        padding: 18px;
      }

      .secondary {
        margin: 10px 0 0;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>LET'S TALK ENGLISH CLASS</header>

  <main>
    <h1>Complete Your Profile</h1>
    <p>
      Fill in your student details. After saving your profile,
      your dashboard will open.
    </p>

    <form id="profileForm" class="panel">
      <h3>Personal details</h3>

      <div class="grid">
        <div class="field">
          <label for="fullName">Full name *</label>
          <input id="fullName" name="fullName" required maxlength="100">
        </div>

        <div class="field">
          <label for="dateOfBirth">Date of birth *</label>
          <input id="dateOfBirth" name="dateOfBirth" type="date" required>
        </div>

        <div class="field">
          <label for="gender">Gender *</label>
          <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
        </div>

        <div class="field">
          <label for="phone">Phone number *</label>
          <input id="phone" name="phone" type="tel" maxlength="20" required>
        </div>

        <div class="field full">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" readonly>
        </div>
      </div>

      <hr>

      <h3>Address details</h3>

      <div class="grid">
        <div class="field full">
          <label for="address">Full address *</label>
          <textarea id="address" name="address" required maxlength="300"></textarea>
        </div>

        <div class="field">
          <label for="city">City</label>
          <input id="city" name="city" maxlength="80">
        </div>

        <div class="field">
          <label for="state">State</label>
          <input id="state" name="state" maxlength="80">
        </div>

        <div class="field">
          <label for="pinCode">PIN code</label>
          <input
            id="pinCode"
            name="pinCode"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            title="Enter a valid 6-digit PIN code"
          >
        </div>
      </div>

      <hr>

      <h3>Academic details</h3>

      <div class="grid">
        <div class="field">
          <label for="qualification">Qualification *</label>
          <input
            id="qualification"
            name="qualification"
            required
            maxlength="100"
            placeholder="Class 11, Class 12, UG..."
          >
        </div>

        <div class="field">
          <label for="schoolCollege">School / College *</label>
          <input
            id="schoolCollege"
            name="schoolCollege"
            required
            maxlength="150"
          >
        </div>

        <div class="field">
          <label for="course">Course *</label>
          <select id="course" name="course" required>
            <option value="">Select course</option>
            <option value="Class 11th English">Class 11th English</option>
            <option value="Class 12th English">Class 12th English</option>
            <option value="English Honours (UG)">English Honours (UG)</option>
            <option value="English Honours (PG)">English Honours (PG)</option>
            <option value="Spoken English Course">Spoken English Course</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="session">Academic session</label>
          <input
            id="session"
            name="session"
            maxlength="20"
            placeholder="2026-2027"
          >
        </div>
      </div>

      <hr>

      <h3>Guardian details</h3>

      <div class="grid">
        <div class="field">
          <label for="guardianName">Guardian name</label>
          <input id="guardianName" name="guardianName" maxlength="100">
        </div>

        <div class="field">
          <label for="guardianPhone">Guardian phone</label>
          <input id="guardianPhone" name="guardianPhone" type="tel" maxlength="20">
        </div>
      </div>

      <div id="formError" class="message" role="alert" aria-live="polite"></div>

      <p class="actions">
        <button id="submitBtn" class="primary" type="submit">
          Save Profile &amp; Open Dashboard
        </button>

        <button id="logoutBtn" class="secondary" type="button">
          Log out
        </button>
      </p>
    </form>
  </main>

  <script>
    const API = `${window.location.origin}/api/student`;

    const form = document.getElementById("profileForm");
    const submitBtn = document.getElementById("submitBtn");
    const formError = document.getElementById("formError");
    const logoutBtn = document.getElementById("logoutBtn");

    function showError(message) {
      formError.textContent = message;
      formError.classList.remove("success");
    }

    function clearError() {
      formError.textContent = "";
      formError.classList.remove("success");
    }

    async function apiRequest(endpoint, options = {}) {
      const response = await fetch(`${API}${endpoint}`, {
        credentials: "include",
        cache: "no-store",
        ...options
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok || data.success === false) {
        if (response.status === 401 || response.status === 403) {
          window.location.replace("student-login.html");
          throw new Error("Your session has expired. Please log in again.");
        }

        throw new Error(data.message || "Something went wrong.");
      }

      return data;
    }

    async function loadProfile() {
      try {
        const data = await apiRequest("/me");
        const student = data.student || data;

        if (student.registrationCompleted === true) {
          window.location.replace("student-dashboard.html");
          return;
        }

        const fields = [
          "fullName",
          "dateOfBirth",
          "gender",
          "phone",
          "email",
          "address",
          "city",
          "state",
          "pinCode",
          "qualification",
          "schoolCollege",
          "course",
          "session",
          "guardianName",
          "guardianPhone"
        ];

        fields.forEach((name) => {
          const field = form.elements.namedItem(name);

          if (field && student[name] != null) {
            field.value = name === "dateOfBirth"
              ? String(student[name]).slice(0, 10)
              : student[name];
          }
        });
      } catch (error) {
        if (error.message.toLowerCase().includes("session has expired")) {
          return;
        }

        showError(error.message || "Unable to load your profile.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();

      if (!form.reportValidity()) {
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = "Saving Profile...";

      try {
        const formData = new FormData(form);
        const profile = Object.fromEntries(formData.entries());

        const result = await apiRequest("/complete-registration", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(profile)
        });

        formError.textContent = result.message || "Profile saved successfully.";
        formError.classList.add("success");

        window.location.replace("student-dashboard.html");
      } catch (error) {
        showError(error.message || "Unable to save your profile.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;

      try {
        await apiRequest("/logout", {
          method: "POST"
        });
      } catch (error) {
        console.error("Logout error:", error);
      } finally {
        window.location.replace("student-login.html");
      }
    });

    loadProfile();
  </script>
</body>
</html>
