
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Let's Talk English Class</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    linear-gradient(
      135deg,
      rgba(239, 246, 255, 0.82),
      rgba(238, 242, 255, 0.78)
    ),
    url("./images/Friendly Customer Support Assistant.png") center / cover no-repeat fixed;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  color: #172033;
}

.card {
  width: 100%;
  max-width: 440px;
  background: linear-gradient(145deg, #1d4ed8, #2563eb, #3b82f6);
  padding: 32px;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(37, 99, 235, 0.3);
  color: white;
}

.card h1 {
  color: white;
}

.card p,
.card .help,
.card .footer {
  color: #dbeafe;
}

.card label {
  color: white;
}

.card .brand {
  color: #bfdbfe;
}

.card input {
  background: white;
  color: #172033;
}

.card .message {
  color: #fecaca;
}

    .brand {
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 24px;
      letter-spacing: .4px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 18px 0 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dbe2ee;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #2563eb18;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      color: #b91c1c;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .footer {
      text-align: center;
      font-size: 14px;
      margin-top: 22px;
      color: #64748b;
    }

    .help {
      font-size: 13px;
      color: #64748b;
      margin-top: 14px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">LET'S TALK ENGLISH CLASS</div>

    <h1>Welcome back</h1>

    <p>
      Enter the Login ID and password provided by your administrator
      to access your student profile.
    </p>

    <form id="loginForm">
      <label for="studentId">Student Login ID</label>

      <input
        id="studentId"
        name="studentId"
        type="text"
        autocomplete="username"
        required
        maxlength="30"
        placeholder="Enter your Login ID"
      >

      <label for="password">Password</label>

      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        maxlength="72"
        placeholder="Enter your password"
      >

      <button id="submitBtn" type="submit">Login</button>

      <div
        id="message"
        class="message"
        role="alert"
        aria-live="polite"
      ></div>
    </form>

    <div class="help">
      Forgot your credentials? Please contact the administrator.
    </div>

    <div class="footer">
      Student accounts are created by the administrator.
    </div>
  </main>

  <script>
    const API = "http://127.0.0.1:5000/api/student";

    const loginForm = document.getElementById("loginForm");
    const studentIdInput = document.getElementById("studentId");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      message.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      try {
        const response = await fetch(`${API}/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            studentId: studentIdInput.value.trim().toUpperCase(),
            password: passwordInput.value
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || "Invalid Login ID or password."
          );
        }

        const profileResponse = await fetch(`${API}/me`, {
          method: "GET",
          credentials: "include"
        });

        const profileData = await profileResponse.json().catch(() => ({}));

        if (!profileResponse.ok || !profileData.success) {
          throw new Error(
            profileData.message || "Unable to load your student profile."
          );
        }

        if (!profileData.student) {
          throw new Error("Student profile was not returned by the server.");
        }

        const student = profileData.student;

        if (student.registrationCompleted === true) {
          window.location.replace("student-dashboard.html");
        } else {
          window.location.replace("student-registration.html");
        }

      } catch (error) {
        message.textContent =
          error.message || "Unable to connect to the backend.";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
