
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration | Let's Talk English Class</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #f3f6fc;
      color: #173b70;
      font-family: Poppins, sans-serif;
    }

    .registration-card {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 30px;
      background: white;
      border: 1px solid #e3eaf4;
      border-radius: 20px;
      box-shadow: 0 12px 40px #173b7012;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
    }

    .brand span { color: #e9a23b; }

    .subtitle {
      color: #718096;
      font-size: 14px;
    }

    .section-title {
      margin: 25px 0 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e7edf5;
      font-size: 17px;
      font-weight: 700;
    }

    label {
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
    }

    .form-control, .form-select {
      min-height: 45px;
      border-color: #dce5f0;
      border-radius: 9px;
    }

    .form-control:focus, .form-select:focus {
      border-color: #2864a8;
      box-shadow: 0 0 0 3px #2864a81a;
    }

    .btn-main {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: #173b70;
      color: white;
      font-weight: 600;
    }

    .btn-main:hover {
      background: #2864a8;
      color: white;
    }

    .btn-main:disabled { opacity: .6; }

    .hint {
      color: #718096;
      font-size: 12px;
    }

    @media (max-width: 576px) {
      .registration-card { padding: 20px; }
    }
  </style>
</head>

<body>
  <main class="registration-card">
    <div class="brand mb-2">LET'S TALK <span>ENGLISH</span></div>

    <h1 class="h4 fw-bold mt-4">Student Registration</h1>

    <p class="subtitle">
      Complete your profile using the account provided by your institute.
    </p>

    <div id="message" class="alert d-none" role="status" aria-live="polite"></div>

    <form id="registrationForm">
      <h2 class="section-title">Account Verification</h2>

      <div class="row g-3">
        <div class="col-md-6">
          <label for="studentId">Student Login ID *</label>
          <input
            id="studentId"
            class="form-control"
            required
            minlength="3"
            maxlength="30"
            pattern="[A-Za-z0-9_-]+"
            autocomplete="username"
          >
        </div>

        <div class="col-md-6">
          <label for="temporaryPassword">Temporary Password *</label>
          <input
            id="temporaryPassword"
            class="form-control"
            type="password"
            required
            minlength="8"
            maxlength="72"
            autocomplete="current-password"
          >
        </div>
      </div>

      <h2 class="section-title">Personal Details</h2>

      <div class="row g-3">
        <div class="col-md-6">
          <label for="fullName">Full Name *</label>
          <input
            id="fullName"
            class="form-control"
            required
            minlength="2"
            maxlength="100"
            autocomplete="name"
          >
        </div>

        <div class="col-md-6">
          <label for="email">Email Address *</label>
          <input
            id="email"
            class="form-control"
            type="email"
            required
            maxlength="254"
            autocomplete="email"
          >
        </div>

        <div class="col-md-6">
          <label for="phone">Phone Number</label>
          <input
            id="phone"
            class="form-control"
            type="tel"
            maxlength="20"
            autocomplete="tel"
          >
        </div>

        <div class="col-md-6">
          <label for="dateOfBirth">Date of Birth</label>
          <input id="dateOfBirth" class="form-control" type="date">
        </div>

        <div class="col-md-6">
          <label for="gender">Gender</label>
          <select id="gender" class="form-select">
            <option value="Prefer not to say">Prefer not to say</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="qualification">Highest Qualification</label>
          <input id="qualification" class="form-control" maxlength="100">
        </div>
      </div>

      <h2 class="section-title">Course &amp; Education</h2>

      <div class="row g-3">
        <div class="col-md-6">
          <label for="course">Course *</label>
          <select id="course" class="form-select" required>
            <option value="">Select your course</option>
            <option value="Class 11 English">Class 11 English</option>
            <option value="Class 12 English">Class 12 English</option>
            <option value="English Honours UG">English Honours UG</option>
            <option value="English Honours PG">English Honours PG</option>
            <option value="Spoken English">Spoken English</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="schoolCollege">School / College</label>
          <input id="schoolCollege" class="form-control" maxlength="150">
        </div>

        <div class="col-md-6">
          <label for="session">Academic Session</label>
          <input
            id="session"
            class="form-control"
            maxlength="20"
            placeholder="Example: 2026-27"
          >
        </div>
      </div>

      <h2 class="section-title">Address</h2>

      <div class="row g-3">
        <div class="col-12">
          <label for="address">Full Address</label>
          <textarea
            id="address"
            class="form-control"
            rows="3"
            maxlength="300"
          ></textarea>
        </div>

        <div class="col-md-4">
          <label for="city">City</label>
          <input id="city" class="form-control" maxlength="80">
        </div>

        <div class="col-md-4">
          <label for="state">State</label>
          <input id="state" class="form-control" maxlength="80">
        </div>

        <div class="col-md-4">
          <label for="pinCode">PIN Code</label>
          <input
            id="pinCode"
            class="form-control"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            title="Enter a valid 6-digit PIN code"
          >
        </div>
      </div>

      <h2 class="section-title">Parent / Guardian</h2>

      <div class="row g-3">
        <div class="col-md-6">
          <label for="guardianName">Guardian Name</label>
          <input id="guardianName" class="form-control" maxlength="100">
        </div>

        <div class="col-md-6">
          <label for="guardianPhone">Guardian Phone</label>
          <input
            id="guardianPhone"
            class="form-control"
            type="tel"
            maxlength="20"
          >
        </div>
      </div>

      <div class="form-check mt-4">
        <input
          id="confirmDetails"
          class="form-check-input"
          type="checkbox"
          required
        >

        <label class="form-check-label" for="confirmDetails">
          I confirm that the information provided is correct.
        </label>
      </div>

      <p class="hint mt-2">
        Your profile will be linked to your existing student account.
      </p>

      <button id="submitButton" class="btn-main w-100 mt-3" type="submit">
        Complete Registration
      </button>

      <div class="text-center mt-3">
        <a href="student-login.html">Back to Student Login</a>
      </div>
    </form>
  </main>

  <script>
    (() => {
      "use strict";

      const API = `${window.location.origin}/api/student`;

      const form = document.getElementById("registrationForm");
      const message = document.getElementById("message");
      const button = document.getElementById("submitButton");

      const value = id =>
        document.getElementById(id).value.trim();

      function showMessage(text, type = "danger") {
        message.textContent = text;
        message.className = `alert alert-${type}`;
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        message.className = "alert d-none";

        if (!form.reportValidity()) return;

        const payload = {
          studentId: value("studentId").toUpperCase(),
          password: document.getElementById("temporaryPassword").value,
          fullName: value("fullName"),
          email: value("email"),
          phone: value("phone"),
          dateOfBirth: value("dateOfBirth") || null,
          gender: value("gender"),
          qualification: value("qualification"),
          course: value("course"),
          schoolCollege: value("schoolCollege"),
          session: value("session"),
          address: value("address"),
          city: value("city"),
          state: value("state"),
          pinCode: value("pinCode"),
          guardianName: value("guardianName"),
          guardianPhone: value("guardianPhone")
        };

        button.disabled = true;
        button.textContent = "Submitting...";

        try {
          const response = await fetch(`${API}/complete-registration`, {
            method: "POST",
            credentials: "include",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok || data.success === false) {
            throw new Error(data.message || "Registration failed.");
          }

          showMessage(
            data.message || "Registration completed successfully.",
            "success"
          );

          window.setTimeout(() => {
            window.location.replace("student-dashboard.html");
          }, 700);

        } catch (error) {
          showMessage(
            error.message || "Cannot connect to the backend."
          );
        } finally {
          button.disabled = false;
          button.textContent = "Complete Registration";
        }
      });
    })();
  </script>
</body>
</html>
